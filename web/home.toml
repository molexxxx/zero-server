# How the work is paid for. The software is free; what costs money is the
# hardware a benchmark needs to be honest.

[backing]
lead = "zero-core is free and Apache-2.0 licensed. What costs money is the benchmark: a rented Linux host, or two bare-metal instances on the same switch, on which the numbers are taken. Until such a run exists, no throughput or latency figure is published for this core, and every figure that is published carries the ratio against the pinned reference entry measured beside it in the same session."
note_title = "How a number gets published"
note = "Every published figure is a median of five interleaved runs against the unmodified reference entry on the same hardware, with a win required in every run, error counters at zero at every level, and the ratio printed beside the absolute number. A run on a link that caps every entry at the same figure reports a ratio against the link ceiling only."
offers = [
  { name = "Benchmark hardware", state = "Not open" },
  { name = "Sponsored builds", state = "Not open" },
]
opens = "Each opens once release 1 has shipped and the first tiered run is published."
# The handler tiers a request can stop at, in the order the core tries them:
# the cheaper the tier, the less the host is involved.
rungs = [
  { name = "Tier 0, policy", cost = "No boundary", detail = "Rules evaluated in Rust from a table: CORS, headers, limits, rate limits, a 4xx answered here." },
  { name = "Tier 1, cache", cost = "No boundary", detail = "A per-core response cache with TTL and tag invalidation." },
  { name = "Tier 2, data", cost = "No boundary", detail = "A query plan the core executes against a driver and renders itself." },
  { name = "Tier 3, host handler", cost = "One call per batch", detail = "A handler in TypeScript, Python or C# over a batch of slots." },
  { name = "Tier 4, native plugin", cost = "One call per request", detail = "A cdylib loaded under the documented trust model, with the full privilege of the process." },
]
