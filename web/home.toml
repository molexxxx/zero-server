[hero]
eyebrow = "the native core of zero-server"
title = ["One Rust core.", "Three languages.", "Every byte", "held to its RFC."]
lead = "zero-core is the memory-safe engine under zero-server: HTTP/1.1, routing, static files, WebSocket, server-sent events and TLS in Rust, reached from TypeScript, Python and C# through one C ABI, with every parser pinned to the specification it implements."

# What it runs: three services and the host that drives them, each played by a
# console in web/js/consoles.js under the same key. Every crate named here
# ships in release 1.

[[scenario]]
key = "api"
group = "server"
tab = "API"
eyebrow = "JSON API · router · request policy"
title = "A request parsed, routed and answered without leaving the core."
body = "A JSON API answers from the router: the head is parsed off the wire into byte ranges, the path is matched by method and segment, CORS and the security headers are applied from a rule table, and the response is written straight into the connection's buffer. Nothing crosses into the host language unless a route asks it to."
crates = ["zero-http1", "zero-router", "zero-policy", "zero-json", "zero-http", "zero-http-types"]
# The figure's opening state before the console runs; a placeholder, not a measurement.
readings = [
  { label = "Connections", value = "0", unit = "" },
  { label = "Pipelined", value = "0", unit = "in flight" },
  { label = "Route", value = "Idle", unit = "" },
  { label = "Policy", value = "CORS, headers", unit = "" },
  { label = "Host calls", value = "0", unit = "" },
]

[[scenario]]
key = "site"
group = "server"
tab = "Site"
eyebrow = "Static files · TLS · validators"
title = "A site served from disk with the path checked on every segment."
body = "A static site is served over TLS with a precomputed header block per asset, ETag and Last-Modified validators, byte ranges and a bounded per-core file cache. A symlink cannot escape the root, a dotfile segment is refused, and the media type comes from the file's own table."
crates = ["zero-static", "zero-tls", "zero-mime", "zero-date"]
readings = [
  { label = "TLS", value = "1.3", unit = "" },
  { label = "Cached assets", value = "0", unit = "" },
  { label = "Conditional", value = "304", unit = "" },
  { label = "Ranges", value = "On", unit = "" },
  { label = "Root", value = "Sealed", unit = "" },
]

[[scenario]]
key = "rooms"
group = "server"
tab = "Rooms"
eyebrow = "WebSocket rooms · server-sent events"
title = "Ten thousand open connections, and the frames never copied."
body = "A chat server keeps its connections open in the core: frames are unmasked in place, text is validated across fragments as it arrives, rooms fan a message out across cores, and a dashboard reads a server-sent event stream that resumes from its last id. The host is called once per message, in a batch, never per frame."
crates = ["zero-ws", "zero-realtime", "zero-sse", "zero-simd"]
readings = [
  { label = "Open sockets", value = "0", unit = "" },
  { label = "Rooms", value = "0", unit = "" },
  { label = "Fan-out", value = "Cross-core", unit = "" },
  { label = "Event stream", value = "Idle", unit = "" },
  { label = "Frames copied", value = "0", unit = "" },
]

[[scenario]]
key = "host"
group = "bindings"
tab = "Host"
eyebrow = "Node, Python, C# · one C ABI"
title = "The same handler in TypeScript, Python and C#, over one core."
body = "A route handler written in the host language runs on a batch of requests the core hands over through the C ABI. Each request is a slot in a per-worker arena with an ownership word, so a late accessor from the host finds a closed slot instead of another request's memory, and a panic anywhere in the core is caught at the boundary and answered with a 500."
crates = ["zero-ffi", "zero-rt", "zero-io", "zero-core", "zero-limits", "zero-sys"]
readings = [
  { label = "Bindings", value = "3", unit = "" },
  { label = "Batch size", value = "0", unit = "" },
  { label = "Slots leased", value = "0", unit = "" },
  { label = "Panics caught", value = "0", unit = "" },
  { label = "Workers", value = "Per core", unit = "" },
]

# Where it is going. Each tag is in one state: `ships`, `next`, or `later`. A tag
