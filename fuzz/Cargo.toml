# The libFuzzer targets: one per parser entry point, each with a checked-in seed
# set under seeds/<target>/ and a dictionary under dictionaries/<target>.dict.
# `cargo fuzz run <target> fuzz/corpus/<target> fuzz/seeds/<target>` grows the
# ignored corpus from the seeds; a crash artifact that is fixed is copied into
# the seeds as a regression input. This package is excluded from the workspace:
# it builds on nightly with sanitizers and is never published.

[package]
name = "zero-server-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
# crates.io max_stable_version 0.4.13, updated 2026-06-04, read 2026-10-01.
libfuzzer-sys = "0.4.13"
zero-simd = { path = "../crates/zero-simd" }
zero-http1 = { path = "../crates/zero-http1" }
zero-limits = { path = "../crates/zero-limits" }
zero-sys = { path = "../crates/zero-sys" }
zero-uri = { path = "../crates/zero-uri" }
zero-qs = { path = "../crates/zero-qs" }
zero-json = { path = "../crates/zero-json" }
zero-router = { path = "../crates/zero-router" }
zero-core = { path = "../crates/zero-core" }
zero-http-types = { path = "../crates/zero-http-types" }

[[bin]]
name = "cmsg_decode"
path = "fuzz_targets/cmsg_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "utf8_validate"
path = "fuzz_targets/utf8_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "simd_kernels"
path = "fuzz_targets/simd_kernels.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http1_head"
path = "fuzz_targets/http1_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http1_chunked"
path = "fuzz_targets/http1_chunked.rs"
test = false
doc = false
bench = false

[[bin]]
name = "uri_normalize"
path = "fuzz_targets/uri_normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qs_parse"
path = "fuzz_targets/qs_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_parse"
path = "fuzz_targets/json_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "router_resolve"
path = "fuzz_targets/router_resolve.rs"
test = false
doc = false
bench = false
