[package]
name = "zero-server-python"
version = "0.1.0"
edition = "2021"
# The core workspace sets the minimum supported Rust version; the binding cannot
# build with an older toolchain than zero-ffi requires.
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/molexxxx/zero-core"
authors = ["molexxxx"]
publish = false

[lib]
name = "zero_server_python"
crate-type = ["cdylib", "rlib"]

# Regenerates the committed type stub from the Rust source. Built without
# pyo3/extension-module so it links libpython and can run as a normal binary.
# Kept at src/stub_gen.rs (not src/bin/) so the repo's .NET bin/ ignore rule
# does not exclude it.
[[bin]]
name = "stub_gen"
path = "src/stub_gen.rs"
required-features = ["stubs"]

[features]
default = []
# The stub generator is a development tool; a wheel build never enables it, so
# pyo3-stub-gen stays out of the published dependency graph.
stubs = ["dep:pyo3-stub-gen"]

[dependencies]
# abi3-py310 (not py39) because pyo3-stub-gen references the 3.10+ stable-ABI
# EncodingWarning type, which a lower abi3 floor would hide.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-stub-gen = { version = "0.23", optional = true }
zero-ffi = { path = "../../../../crates/zero-ffi" }

# The audited lint table (docs/lints/audited.toml): unsafe code is allowed per item
# with a SAFETY comment, and cargo xtask lints --check diffs this copy against it.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
