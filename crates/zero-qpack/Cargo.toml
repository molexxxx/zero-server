[package]
name = "zero-qpack"
description = "RFC 9204 QPACK static table, field section prefix, static-only encoder and decoder, and the integer and Huffman coding for zero-server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["qpack", "http3", "huffman", "rfc9204", "no-std"]
categories = ["compression", "network-programming", "web-programming", "no-std"]
authors.workspace = true

[features]
# `std` is on by default and brings in the `std::error::Error` impls for hosted
# targets. Turn it off (`default-features = false`) to build for a `no_std`
# target, where the crate relies only on `core` and `alloc`.
default = ["std"]
std = ["zero-core/std", "zero-limits/std"]

[dependencies]
# This crate is `no_std`, so it takes its dependencies without their default `std`
# feature. They are declared directly rather than inherited, because
# `default-features` cannot be overridden through workspace inheritance.
zero-core = { path = "../zero-core", version = "0.1.0", default-features = false }
zero-limits = { path = "../zero-limits", version = "0.1.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
