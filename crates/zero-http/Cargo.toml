[package]
name = "zero-http"
description = "The HTTP/1.1 connection driver of zero-server with the pipelining ring, limits and timeouts, and the handler ABI for tiers 0 to 4."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["http", "http1", "server", "pipelining", "async"]
categories = ["web-programming::http-server", "network-programming", "asynchronous"]
authors.workspace = true

[features]
default = ["io-tokio"]
io-tokio = ["zero-io/io-tokio"]
io-compio = ["zero-io/io-compio"]

[dependencies]
zero-core.workspace = true
zero-limits.workspace = true
zero-http-types.workspace = true
zero-http1.workspace = true
zero-io.workspace = true
zero-rt.workspace = true
zero-sys.workspace = true
zero-router.workspace = true
zero-uri.workspace = true

[dev-dependencies]
zero-date.workspace = true
zero-mime.workspace = true

[lints]
workspace = true
