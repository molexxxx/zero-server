[package]
name = "zero-sys"
description = "Audited wrappers over every raw operating-system call the zero-server workspace makes: socket options, control messages, thread affinity, and random bytes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
zero-core.workspace = true

# The raw calls go through the crates tokio's own graph already carries, at the versions
# crates.io reported on 2026-10-01: libc 0.2.189 (updated 2026-08-03), socket2 0.6.5
# (updated 2026-07-13; `all` unlocks the Linux-only setters it wraps) and windows-sys
# 0.61.2 (updated 2025-10-06).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189", default-features = false }
socket2 = { version = "0.6.5", default-features = false, features = ["all"] }

[target.'cfg(windows)'.dependencies]
socket2 = { version = "0.6.5", default-features = false, features = ["all"] }
windows-sys = { version = "0.61.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
