[package]
name = "zero-http1"
description = "HTTP/1.1 request head parser, chunked coding, framing rules, trailers, and the validating response serializer for zero-server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["http", "http1", "parser", "chunked", "no-std"]
categories = ["parser-implementations", "web-programming::http-server", "network-programming", "no-std"]
authors.workspace = true

[features]
# `std` is on by default and brings in the `std::error::Error` impls for hosted
# targets. Turn it off (`default-features = false`) to build for a `no_std`
# target, where the crate relies only on `core` and `alloc`.
default = ["std"]
std = [
  "zero-core/std",
  "zero-http-types/std",
  "zero-simd/std",
  "zero-limits/std",
  "zero-date/std",
]

[dependencies]
# This crate is `no_std`, so it takes its dependencies without their default `std`
# feature. They are declared directly rather than inherited, because
# `default-features` cannot be overridden through workspace inheritance.
zero-core = { path = "../zero-core", version = "0.1.0", default-features = false }
zero-http-types = { path = "../zero-http-types", version = "0.1.0", default-features = false }
zero-simd = { path = "../zero-simd", version = "0.1.0", default-features = false }
zero-limits = { path = "../zero-limits", version = "0.1.0", default-features = false }
zero-date = { path = "../zero-date", version = "0.1.0", default-features = false }

[dev-dependencies]
# The counting allocator the unit tests install to show that the parser, the
# chunked decoder and the serializer never call the global allocator.
zero-sys = { path = "../zero-sys", version = "0.1.0" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
