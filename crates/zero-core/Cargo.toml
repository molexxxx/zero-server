[package]
name = "zero-core"
description = "Error and Result types, the Codec trait, owned buffers, slot ids, the Value model, and the primitive traits shared by every zero-server crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["http", "server", "buffer", "error", "no-std"]
categories = ["web-programming::http-server", "no-std"]
authors.workspace = true

[features]
# `std` is on by default and brings in the `std::error::Error` impl for hosted
# targets. Turn it off (`default-features = false`) to build the core for a `no_std`
# target, where it relies only on `core` and `alloc`.
default = ["std"]
std = []

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
