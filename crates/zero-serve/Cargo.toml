[package]
name = "zero-serve"
description = "The standalone zero-server binary, zero: serve a directory of static files over HTTP/1.1 or HTTPS, with the default security headers and a graceful drain on a stop signal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The binary is invoked as `zero serve`, `zero version` and `zero help`.
[[bin]]
name = "zero"
path = "src/main.rs"

[dependencies]
zero-core.workspace = true
zero-sys.workspace = true
zero-io.workspace = true
zero-rt.workspace = true
zero-http-types.workspace = true
zero-http.workspace = true
zero-static.workspace = true
zero-policy.workspace = true
zero-realtime.workspace = true
zero-tls.workspace = true

# The HTTPS client of the end-to-end test: the rustls that zero-tls already pins
# (0.23.45, the stable line on crates.io and not yanked, checked 2026-10-02), with
# the same features, so the graph gains no crate and no feature.
[dev-dependencies]
rustls = { version = "0.23.45", default-features = false, features = [
    "std",
    "aws_lc_rs",
    "tls12",
    "prefer-post-quantum",
] }

[lints]
workspace = true
