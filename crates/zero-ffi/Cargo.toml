[package]
name = "zero-ffi"
description = "The curated C ABI over the zero-server core: the generated header, ZeroStatus, the thread-local last error, and catch_unwind at every export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ffi", "c-abi", "http", "server", "bindings"]
categories = ["development-tools::ffi", "web-programming::http-server", "api-bindings"]
authors.workspace = true

[lib]
# cdylib is loaded by .NET (P/Invoke) and any dynamically linked C/C++ host;
# staticlib serves C/C++ projects that link statically; lib lets the build script
# and tests use the crate normally.
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# The capabilities of zero-host, forwarded one to one with the same default set.
default = ["static", "policy", "realtime", "tls"]
static = ["zero-host/static"]
policy = ["zero-host/policy"]
realtime = ["zero-host/realtime"]
tls = ["zero-host/tls"]

[dependencies]
zero-core.workspace = true
zero-limits.workspace = true
zero-http-types.workspace = true
zero-http.workspace = true
# Declared directly rather than inherited, because `default-features` cannot be
# overridden through workspace inheritance; the features above choose what it builds.
zero-host = { path = "../zero-host", version = "0.1.0", default-features = false }

# The same crate with its test hooks, for this crate's tests only: Cargo enables a
# dev-dependency's features only for the targets that build dev-dependencies.
[dev-dependencies]
zero-host = { path = "../zero-host", version = "0.1.0", default-features = false, features = [
    "testing",
] }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
