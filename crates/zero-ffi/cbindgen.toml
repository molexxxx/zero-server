# The header comment at the top of include/zero.h is the crate documentation of
# src/lib.rs, which build.rs hands to cbindgen, so the rules of the ABI are written
# once.
language = "C"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
autogen_warning = "/* Generated by cbindgen from crates/zero-ffi. Do not edit by hand; run `cargo build -p zero-ffi` to regenerate. */"

[parse]
# Only the curated surface in this crate is exported; core and capability types
# stay internal and are reached through the ids and handles defined here.
parse_deps = false

[enum]
prefix_with_name = true

[export]
item_types = ["constants", "enums", "structs", "typedefs", "opaque", "functions"]
# No export takes or returns the plugin types, so they are named here to reach the
# header; the Rust version constant is for Rust callers only.
include = ["ZeroPluginVTable", "ZeroHostApi", "ZeroPluginAbiVersionFn", "ZeroPluginRegisterFn"]
exclude = ["VERSION"]
