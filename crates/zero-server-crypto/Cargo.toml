[package]
name = "zero-server-crypto"
description = "SHA-1, SHA-256, random bytes, constant-time comparison, zeroizing secrets, and the std primitive traits for zero-server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["sha1", "sha256", "constant-time", "zeroize", "crypto"]
categories = ["cryptography"]
authors.workspace = true

[dependencies]
zero-core.workspace = true
zero-sys.workspace = true
# The crypto provider, at the version crates.io reported on 2026-10-01: aws-lc-rs
# 1.18.1 (updated 2026-09-01) over aws-lc-sys 0.45.0. `aws-lc-sys` selects the
# non-FIPS build; `prebuilt-nasm` lets Windows x86-64 build without NASM installed.
aws-lc-rs = { version = "1.18.1", default-features = false, features = [
    "aws-lc-sys",
    "prebuilt-nasm",
] }
# zeroize 1.9.0 (released 2026-06-12, checked on crates.io 2026-10-01), already in
# the graph through aws-lc-rs with the same `alloc` feature.
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
