[package]
name = "zero-io"
description = "The runtime seam of zero-server: listener, stream, and datagram traits over owned buffers, timers, the date service, and per-core runtimes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
default = ["io-tokio"]
# The readiness backend: one tokio current-thread runtime per core.
io-tokio = ["dep:tokio"]
# The completion backend, built and tested beside io-tokio and never on by default.
io-compio = ["dep:compio-driver", "dep:compio-buf"]

[dependencies]
zero-core.workspace = true
zero-sys.workspace = true
zero-date.workspace = true
zero-limits.workspace = true

# The only third-party runtime the workspace names, with the feature set DESIGN.md
# section 5.3 fixes: no macros, no multi-thread scheduler, no file system. crates.io
# max_stable_version 1.53.1, updated 2026-07-20, read 2026-10-01. socket2 (0.6.5,
# updated 2026-07-13, read the same day) creates the listening sockets, as section
# 5.4 says; every option on them is set through zero-sys.
tokio = { version = "1.53.1", default-features = false, features = [
  "rt",
  "net",
  "time",
  "sync",
  "io-util",
], optional = true }
socket2 = { version = "0.6.5", default-features = false }
# The completion backend: compio-driver's proactor (io_uring with the polling
# fallback on Linux, IOCP on Windows, kqueue through polling on macOS) and the
# buffer traits its operations take (crates.io max_stable_version compio-driver
# 0.12.5 published 2026-08-18 and compio-buf 0.8.3 published 2026-06-14, read
# 2026-10-01; neither yanked; the 0.13 and 0.9 betas of 2026-09-29 are not stable).
compio-driver = { version = "0.12.5", default-features = false, features = [
  "io-uring",
  "polling",
], optional = true }
compio-buf = { version = "0.8.3", default-features = false, optional = true }

[lints]
workspace = true
