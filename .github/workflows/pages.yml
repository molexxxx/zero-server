name: Deploy the site to Pages

# Publishes the site the docs workflow renders (the front page at the root, the pages
# under /docs, the four generated references beside them) to GitHub Pages. Set the
# Pages source to "GitHub Actions" once (Settings -> Pages -> Build and deployment ->
# Source). Runs on demand until the documentation pages and the web tree exist; the
# push trigger returns with the first release.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments: allow one at a time and let an in-progress production
# deployment finish rather than canceling it, which is what leaves the Pages
# environment stuck and fails later runs with "deployment failed, try again later".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read

  deploy:
    needs: docs
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Add the documentation site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
