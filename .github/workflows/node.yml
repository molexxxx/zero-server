name: node

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# ubuntu-24.04 is what ubuntu-latest names today (actions/runner-images README, read
# 2026-10-03).
#
# The binding supports every Node.js line still maintained: 22 and 24 (maintenance
# LTS, end of life 2027-04-30 and 2028-04-30) and 26 (current, LTS from 2026-10-28),
# from https://github.com/nodejs/Release/blob/main/schedule.json, read 2026-10-22.
jobs:
  build:
    name: node ${{ matrix.node }} (build, smoke, guides)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The committed lockfile is the install: npm ci fails rather than resolving anew.
      - name: Install dependencies
        run: npm ci

      - name: Build native addon and facade
        run: npm run build

      # A facade whose dist/ is missing publishes as a package that installs and then
      # cannot be required, and npm reports no error while doing it.
      - name: Every package carries the entry point it declares
        run: npm run check:packaging

      - name: Check generated bindings are in sync with the Rust source
        run: |
          if ! git diff --exit-code -- packages/native/index.js packages/native/index.d.ts; then
            echo "::error::Generated bindings are stale. Run 'npm run build' in bindings/node and commit packages/native/index.js and packages/native/index.d.ts."
            exit 1
          fi

      - name: Smoke, conformance, and guide tests
        run: npm test
