# The badges on molexxxx's profile page, which reads this repository's registries and
# CI. This repository's own badges are not these: `cargo xtask docs` draws them into
# .github/badges/ in the site's palette, and they change when the version does.
name: badges

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]

# The dispatch is authenticated with a personal access token stored as the
# repository secret BADGES_DISPATCH_TOKEN, so the workflow itself needs nothing
# from the automatic GITHUB_TOKEN. Without the secret the step reports and
# skips rather than failing the run.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger badge refresh in molexxxx/molexxxx
        env:
          GH_TOKEN: ${{ secrets.BADGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::BADGES_DISPATCH_TOKEN is not set on this repository; the profile badges were not refreshed."
            exit 0
          fi
          gh api -X POST repos/molexxxx/molexxxx/dispatches \
            -f event_type=refresh-badges \
            -f "client_payload[repo]=${{ github.repository }}"
