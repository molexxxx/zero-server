name: python

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# ubuntu-24.04 is what ubuntu-latest names today (actions/runner-images README, read
# 2026-10-03).
#
# The binding supports every Python version still maintained, 3.11 to 3.15 (3.10
# reached its end of life on 2026-10-01; https://devguide.python.org/versions/, read
# 2026-10-25). It is built on the stable ABI from 3.11, so it runs here on that floor,
# on 3.13, and on the newest line, each at the newest release actions/python-versions
# carries (read 2026-10-25). Actions: actions/checkout v7.0.1 and actions/setup-python
# v7.1.0 from their releases pages; maturin 1.15.0 and pytest 9.1.1 from PyPI; all read
# 2026-10-25.
jobs:
  build:
    name: python ${{ matrix.python }} (build, smoke, C ABI, conformance, guides)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.17", "3.13.17", "3.15.1"]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # The C ABI the ctypes tests load, built as release builds it; the tests find it
      # through ZERO_FFI_LIBRARY.
      - name: Build the C ABI library
        working-directory: .
        run: |
          cargo build -p zero-ffi --release --locked
          echo "ZERO_FFI_LIBRARY=$GITHUB_WORKSPACE/target/release/libzero_ffi.so" >> "$GITHUB_ENV"

      # zero-server-native is the PyO3 crate under packages/native; every other package
      # is pure Python, installed from its directory so the namespace portions merge.
      - name: Set up venv, build the engine, and install every package
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin==1.15.0 pytest==9.1.1
          maturin develop --locked -m packages/native/Cargo.toml
          pip install $(find packages -mindepth 1 -maxdepth 1 -type d ! -name native)

      # The generator is a development tool behind the `stubs` feature, so the
      # published wheel never carries pyo3-stub-gen.
      - name: Regenerate the type stub
        run: cargo run --locked --bin stub_gen --features stubs --manifest-path packages/native/Cargo.toml

      - name: Check the generated stub is in sync with the Rust source
        run: |
          if ! git diff --exit-code -- packages/native/python/zero_server/_native/__init__.pyi; then
            echo "::error::Generated stub is stale. Run 'cargo run --bin stub_gen --features stubs' in bindings/python/packages/native and commit python/zero_server/_native/__init__.pyi."
            exit 1
          fi

      - name: Smoke, C ABI, serve, conformance, and guide suites
        run: .venv/bin/python -m pytest
