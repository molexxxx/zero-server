name: release-python

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, with or without a leading v.
        required: true
        type: string

permissions:
  contents: read

# Runner images are named by version, not -latest, so a release candidate and the tag
# build on the same images: ubuntu-24.04, macos-26 and windows-2025 are what
# ubuntu-latest, macos-latest and windows-latest name today (actions/runner-images
# README, read 2026-10-03; -latest moves to a newer OS over one to two months).
jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    # The preflight lists this commit's workflow runs, which needs actions: read.
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

  build:
    name: wheels ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        # The seven prebuilt targets: the ones aws-lc-sys ships pregenerated bindings
        # for, so no build here needs bindgen or libclang. Any other target is a source
        # build for the consumer, never a bindgen build.
        include:
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          # Native ARM64 runner: the aws-lc-sys cmake build does not cross-compile in
          # the GCC manylinux image, so this wheel is built natively instead.
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          # Cross-compiled on Apple Silicon: scarce macos-13 Intel runners sit
          # unallocated for minutes and stall the whole release.
          - host: macos-26
            target: x86_64-apple-darwin
          - host: macos-26
            target: aarch64-apple-darwin
          - host: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # aws-lc-sys assembles with NASM on Windows x86-64; the crate's prebuilt objects
      # are declined, so the assembler is installed at a pinned version instead.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
        with:
          version: "2.16.01"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path bindings/python/packages/native/Cargo.toml
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: "true"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path bindings/python/packages/native/Cargo.toml

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  pure:
    name: pure packages
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # zero-server-core, every zero-server-<capability>, and the zero-server
      # metapackage are pure Python: one universal wheel and one sdist each.
      - name: Build every pure package
        working-directory: bindings/python
        run: |
          pip install build
          for package in $(find packages -mindepth 1 -maxdepth 1 -type d ! -name native); do
            python -m build --outdir dist "$package"
          done

      - name: Upload the pure packages
        uses: actions/upload-artifact@v7
        with:
          name: wheels-pure
          path: |
            bindings/python/dist/*.whl
            bindings/python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [build, sdist, pure]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download wheel and sdist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # PyPI allows an account four new projects in a rolling twenty-four hours, and a
      # release that introduces a package per capability runs past it. So this uploads in
      # dependency order, the compiled engine first, waits out a reset that is minutes
      # away, and stops with the reset named otherwise. The pypi-backfill workflow claims
      # the rest four a day, and once every project exists a release never meets the cap
      # again.
      - name: Upload in dependency order, waiting out the cap
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PIP_TOKEN }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          python -m pip install --quiet twine
          bash .github/scripts/pypi-upload.sh dist "${VERSION#v}"
