name: release-crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, with or without a leading v.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Runner images are named by version, not -latest, so a release candidate and the tag
# build on the same images: ubuntu-24.04, macos-26 and windows-2025 are what
# ubuntu-latest, macos-latest and windows-latest name today (actions/runner-images
# README, read 2026-10-03; -latest moves to a newer OS over one to two months).
jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    # The preflight lists this commit's workflow runs, which needs actions: read.
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

  publish:
    name: publish to crates.io
    runs-on: ubuntu-24.04
    needs: preflight
    # crates.io takes a burst of five new crates and then one per ten minutes
    # (rust-lang/crates.io src/rate_limiter.rs, read 2026-10-03), so the first
    # release of the 28 published crates waits at least 230 minutes before the
    # verify build of each crate is counted. The job gets 350 of the 360 minutes a
    # hosted runner allows; a rerun skips every crate already published.
    timeout-minutes: 350
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml') }}

      # Publish every workspace crate in dependency order. xtask skips versions
      # already on crates.io and waits out the new-crate rate limit (one new
      # crate per ten minutes), retrying until the whole workspace is published,
      # so a first-time release of many crates completes in a single run.
      - name: Publish crates
        run: cargo xtask release
