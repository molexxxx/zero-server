# Label a pull request from the files it touches, so the release notes group themselves
# and nobody has to remember a label at the moment they are trying to merge.
name: labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# ubuntu-24.04 is what ubuntu-latest names today (actions/runner-images README, read
# 2026-10-03).
jobs:
  label:
    name: label from the changed files
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
