# Dependency policy for the `io-compio` feature graph: the base policy of
# deny.toml plus the crates compio-driver 0.12 brings. Passed with `--config`
# by the job that enables the feature:
#
#   cargo deny --config deny/io-compio.toml --manifest-path crates/zero-io/Cargo.toml --features io-compio check
#
# cargo-deny reads one config file, so the base sections are repeated here and
# must stay in step with deny.toml; the additions are marked "io-compio".
# The extra set was measured with cargo tree on compio-driver 0.12.5 with
# `default-features = false, features = ["io-uring"]` for x86_64-unknown-linux-gnu,
# x86_64-pc-windows-msvc and aarch64-apple-darwin; compio-log makes tracing 0.1
# mandatory on this path.

[graph]
exclude-dev = true
exclude = ["xtask"]
# The feature is never enabled in a published binding, so its graph is judged
# on the targets the release matrix builds, which drops the wasm, Hermit and
# UEFI branches of the transitive crates.
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "i686-pc-windows-msvc",
    "i686-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [{ allow = ["MPL-2.0"], crate = "cbindgen" }]

[bans]
multiple-versions = "deny"
wildcards = "deny"
external-default-features = "deny"
allow = [
    # Workspace members.
    "zero-base64",
    "zero-bench",
    "zero-core",
    "zero-date",
    "zero-examples",
    "zero-ffi",
    "zero-h3",
    "zero-http",
    "zero-http-types",
    "zero-http1",
    "zero-io",
    "zero-json",
    "zero-limits",
    "zero-mime",
    "zero-policy",
    "zero-qpack",
    "zero-qs",
    "zero-realtime",
    "zero-router",
    "zero-rt",
    "zero-serve",
    "zero-server",
    "zero-server-crypto",
    "zero-simd",
    "zero-sse",
    "zero-static",
    "zero-sys",
    "zero-tls",
    "zero-uri",
    "zero-ws",
    # Runtime seam, io-tokio.
    "tokio",
    "mio",
    "socket2",
    "libc",
    "bytes",
    "pin-project-lite",
    "windows-sys",
    "windows-link",
    # TLS engine.
    "rustls",
    "rustls-webpki",
    "rustls-pki-types",
    "untrusted",
    "subtle",
    "zeroize",
    "once_cell",
    # Crypto provider and its transitives.
    "aws-lc-rs",
    "aws-lc-sys",
    "getrandom",
    "cfg-if",
    # Build helpers of the C library builds.
    "cc",
    "shlex",
    "find-msvc-tools",
    "cmake",
    "dunce",
    "fs_extra",
    "jobserver",
    # A build dependency of aws-lc-sys 0.45.0 (pkg-config 0.3.34, released
    # 2026-08-14, checked on crates.io 2026-10-01).
    "pkg-config",
    # Header generator, build-only in zero-ffi, and its transitive graph.
    "cbindgen",
    "bitflags",
    "equivalent",
    "errno",
    "fastrand",
    "hashbrown",
    "heck",
    "indexmap",
    "itoa",
    "linux-raw-sys",
    "log",
    "memchr",
    "proc-macro2",
    "quote",
    "r-efi",
    "rustix",
    "serde",
    "serde_core",
    "serde_derive",
    "serde_json",
    "serde_spanned",
    "syn",
    "tempfile",
    "toml",
    "toml_datetime",
    "toml_parser",
    "toml_writer",
    "unicode-ident",
    "winnow",
    "zmij",
    # io-compio: the compio driver family and its graph.
    "compio-buf",
    "compio-driver",
    "compio-log",
    "compio-send-wrapper",
    "io-uring",
    "polling",
    "cfg_aliases",
    "concurrent-queue",
    "crossbeam-queue",
    "crossbeam-utils",
    "flume",
    "futures-core",
    "futures-macro",
    "futures-task",
    "futures-util",
    "lock_api",
    "mod_use",
    "pastey",
    "scopeguard",
    "slab",
    "smallvec",
    "spin",
    "synchrony",
    "thin-cell",
    "tracing",
    "tracing-core",
]
deny = [
    { crate = "bindgen", reason = "no bindgen build: targets without pregenerated aws-lc-sys bindings use the ring provider; io-uring's bindgen feature stays off" },
    { crate = "libclang-sys", reason = "no libclang in the build: see bindgen" },
    { crate = "clang-sys", reason = "no libclang in the build: see bindgen" },
]
skip-tree = [{ crate = "cbindgen", reason = "build-only tool with its own syn and winnow majors" }]

[[bans.features]]
crate = "bytes"
allow = ["default"]
reason = "enabled by tokio's io-util in the shipped graph; bytes' default feature is `std`"

[[bans.features]]
crate = "fastrand"
allow = ["default"]
reason = "enabled by tempfile inside the cbindgen build-only tree"

[[bans.features]]
crate = "indexmap"
allow = ["default"]
reason = "enabled by cbindgen inside its build-only tree"

[[bans.features]]
crate = "shlex"
allow = ["default", "std"]
reason = "enabled by cc, a build dependency of aws-lc-sys; shlex's default feature is `std`, and it runs only in build scripts"

[[bans.features]]
crate = "zeroize"
allow = ["default", "alloc"]
reason = "enabled by aws-lc-rs in the shipped graph; zeroize's default feature is `alloc`, which every hosted target links anyway"

[[bans.features]]
crate = "libc"
allow = ["default"]
reason = "enabled by mio, tokio and socket2 in the shipped graph; libc's default feature is `std`, which every hosted target links anyway"

[[bans.features]]
crate = "proc-macro2"
allow = ["default"]
reason = "enabled by cbindgen inside its build-only tree"

[[bans.features]]
crate = "quote"
allow = ["default"]
reason = "enabled by cbindgen inside its build-only tree"

# io-compio: compio-driver, polling and socket2 enable the rustix and
# windows-sys families they need on top of the tempfile set (feature lists
# read from the manifests of compio-driver 0.12.5, polling 3.11.0 and socket2
# 0.6.5); the lists are confirmed by the first run of this file once the
# feature exists.
[[bans.features]]
crate = "rustix"
allow = ["default", "event", "fs", "mm", "net", "pipe", "process", "std", "system", "time"]
reason = "enabled by tempfile, compio-driver (mm and system for the io_uring ring) and polling"

# io-compio: the defaults the compio graph enables on its own dependencies, each
# the crate's `std` build (feature lists read from the manifests on 2026-10-01).
[[bans.features]]
crate = "concurrent-queue"
allow = ["default", "std"]
reason = "enabled by polling"

[[bans.features]]
crate = "crossbeam-queue"
allow = ["default", "std", "alloc"]
reason = "enabled by compio-driver"

[[bans.features]]
crate = "futures-util"
allow = ["default", "std", "alloc", "async-await", "async-await-macro", "futures-macro", "slab"]
reason = "enabled by compio-driver"

[[bans.features]]
crate = "linux-raw-sys"
allow = [
    "default",
    "std",
    "general",
    "errno",
    "io_uring",
    "elf",
    "ioctl",
    "no_std",
    "auxvec",
    "if_ether",
    "net",
    "netlink",
    "prctl",
    "system",
    "xdp",
]
reason = "enabled by rustix (net, event, mm, system) and compio-driver (io_uring)"

[[bans.features]]
crate = "lock_api"
allow = ["default", "atomic_usize"]
reason = "enabled by spin inside synchrony"

[[bans.features]]
crate = "once_cell"
allow = ["default", "std", "alloc", "race"]
reason = "enabled by compio-driver"

[[bans.features]]
crate = "spin"
allow = ["default", "lock_api", "mutex", "spin_mutex", "rwlock", "once", "lazy", "barrier"]
reason = "enabled by synchrony"

[[bans.features]]
crate = "syn"
allow = ["default", "clone-impls", "derive", "parsing", "printing", "proc-macro", "full"]
reason = "enabled by futures-macro and compio-send-wrapper"

[[bans.features]]
crate = "serde_derive"
allow = ["default"]
reason = "enabled by serde inside the cbindgen build-only tree"

[[bans.features]]
crate = "serde_json"
allow = ["default"]
reason = "enabled by cbindgen inside its build-only tree"

[[bans.features]]
crate = "tempfile"
allow = ["default"]
reason = "enabled by cbindgen inside its build-only tree"

[[bans.features]]
crate = "windows-sys"
allow = [
    "default",
    "Wdk",
    "Wdk_Foundation",
    "Wdk_Storage",
    "Wdk_Storage_FileSystem",
    "Wdk_System",
    "Wdk_System_IO",
    "Win32",
    "Win32_Foundation",
    "Win32_Networking",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System",
    "Win32_System_Console",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]
reason = "the tempfile and io-compio sets, and in the shipped graph tokio (net), mio (os-ext and its Windows driver), socket2 and zero-sys (sockets, affinity); the parents of each leaf feature count as enabled too"

[bans.build]
allow-build-scripts = [
    "aws-lc-sys",
    "aws-lc-rs",
    "ring",
    "rustls",
    "libsqlite3-sys",
    "libmimalloc-sys",
    "napi-build",
    "pyo3-build-config",
    "zero-ffi",
    "cbindgen",
    "libc",
    "getrandom",
    "proc-macro2",
    "quote",
    "rustix",
    "serde",
    "serde_core",
    "serde_json",
    "zmij",
    # io-compio: cfg probes only, none compiles C.
    "compio-driver",
    "crossbeam-utils",
    "io-uring",
]
executables = "deny"
include-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
