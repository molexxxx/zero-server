# Dependency policy for the Node binding graph (bindings/node, a standalone
# crate outside the workspace). cargo-deny takes one configuration per run, so
# this file repeats the root deny.toml for the core crates the binding links
# through zero-host and adds the napi graph the binding brings; a change to the
# root policy is mirrored here and in deny/python.toml.
# Run with:
#   cargo deny --manifest-path bindings/node/Cargo.toml --config deny/node.toml check

[graph]
exclude-dev = true
# The seven prebuilt targets of the release workflows, as in the root policy; a
# dependency another target would pull is outside the shipped graph.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
external-default-features = "deny"

allow = [
    # The binding crate and the core crates it links through zero-host.
    "zero-server-node",
    "zero-base64",
    "zero-core",
    "zero-date",
    "zero-h3",
    "zero-host",
    "zero-http",
    "zero-http-types",
    "zero-http1",
    "zero-io",
    "zero-json",
    "zero-limits",
    "zero-mime",
    "zero-policy",
    "zero-qpack",
    "zero-realtime",
    "zero-router",
    "zero-rt",
    "zero-server-crypto",
    "zero-simd",
    "zero-sse",
    "zero-static",
    "zero-sys",
    "zero-tls",
    "zero-uri",
    "zero-ws",
    # Runtime seam, io-tokio, as in the root policy. Checked against crates.io on
    # 2026-10-14: none yanked, each released within the year (tokio 1.53.3 on
    # 2026-10-13, mio 1.2.3 on 2026-09-02, socket2 0.6.5 on 2026-07-13, libc 0.2.190
    # on 2026-10-02, bytes 1.12.1 on 2026-07-08, pin-project-lite 0.2.17 on
    # 2026-02-27, windows-sys 0.61.2 on 2025-10-06, windows-link 0.2.1 as its
    # dependency).
    "tokio",
    "mio",
    "socket2",
    "libc",
    "bytes",
    "pin-project-lite",
    "windows-sys",
    "windows-link",
    # TLS engine, as in the root policy.
    "rustls",
    "rustls-webpki",
    "rustls-pki-types",
    "untrusted",
    "subtle",
    "zeroize",
    "once_cell",
    # Crypto provider and its build helpers, as in the root policy.
    "aws-lc-rs",
    "aws-lc-sys",
    "getrandom",
    "cfg-if",
    "cc",
    "shlex",
    "find-msvc-tools",
    "cmake",
    "dunce",
    "fs_extra",
    "jobserver",
    "pkg-config",
    # Node-API glue: napi 3 with the napi7 feature only, its derive macros, the
    # raw symbol table and the build helper (measured with cargo tree over the
    # seven targets on 2026-10-23 against napi 3.14.2, napi-derive 3.6.12,
    # napi-sys 3.4.0, napi-build 2.6.0).
    "napi",
    "napi-build",
    "napi-derive",
    "napi-derive-backend",
    "napi-sys",
    "bitflags",
    "convert_case",
    "ctor",
    "futures",
    "futures-channel",
    "futures-core",
    "futures-executor",
    "futures-io",
    "futures-macro",
    "futures-sink",
    "futures-task",
    "futures-util",
    "libloading",
    "memchr",
    "nohash-hasher",
    "proc-macro2",
    "quote",
    "rustc-hash",
    "semver",
    "slab",
    "syn",
    "unicode-ident",
    "unicode-segmentation",
]

deny = [
    { crate = "bindgen", reason = "no bindgen build: targets without pregenerated aws-lc-sys bindings use the ring provider" },
    { crate = "libclang-sys", reason = "no libclang in the build: see bindgen" },
    { crate = "clang-sys", reason = "no libclang in the build: see bindgen" },
]

# The core crates are external to the binding's graph, so their `std` default
# is listed; the binding runs on std by definition.
[[bans.features]]
crate = "zero-base64"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-core"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-date"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-h3"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-http-types"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-http1"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-json"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-limits"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-mime"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-qpack"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-router"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-sse"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-uri"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-ws"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-host"
allow = ["default", "static", "policy", "realtime", "tls"]
reason = "the binding serves every capability the host layer offers: static files, policies, WebSocket and SSE, TLS"

[[bans.features]]
crate = "zero-http"
allow = ["default", "io-tokio"]
reason = "the binding links the core on its default readiness backend"

[[bans.features]]
crate = "zero-io"
allow = ["default", "io-tokio"]
reason = "the binding links the core on its default readiness backend"

# Defaults the napi graph and the shipped core graph enable on their own
# dependencies.
[[bans.features]]
crate = "futures"
allow = ["default", "std", "async-await", "executor"]
reason = "enabled by napi"

[[bans.features]]
crate = "rustls-pki-types"
allow = ["default", "alloc", "std"]
reason = "enabled by rustls in the shipped graph; rustls-pki-types' default feature is `alloc`, and rustls's `std` turns on its `std`; every hosted target links both anyway"

[[bans.features]]
crate = "shlex"
allow = ["default", "std"]
reason = "enabled by cc, a build dependency of aws-lc-sys; shlex's default feature is `std`, and it runs only in build scripts"

[[bans.features]]
crate = "zeroize"
allow = ["default", "alloc"]
reason = "enabled by aws-lc-rs in the shipped graph; zeroize's default feature is `alloc`, which every hosted target links anyway"

[[bans.features]]
crate = "bytes"
allow = ["default"]
reason = "enabled by tokio's io-util in the shipped graph; bytes' default feature is `std`"

[[bans.features]]
crate = "libc"
allow = ["default", "std"]
reason = "enabled by socket2 in the shipped graph and by libloading and napi-sys"

[[bans.features]]
crate = "libloading"
allow = ["default"]
reason = "enabled by napi-sys"

[[bans.features]]
crate = "memchr"
allow = ["default", "std"]
reason = "enabled by futures-util in the napi graph"

[[bans.features]]
crate = "napi-derive"
allow = ["default", "type-def", "full"]
reason = "the binding's own edge"

[[bans.features]]
crate = "nohash-hasher"
allow = ["default", "std"]
reason = "enabled by napi"

[[bans.features]]
crate = "rustc-hash"
allow = ["default", "std"]
reason = "enabled by napi-derive-backend"

[[bans.features]]
crate = "semver"
allow = ["default", "std"]
reason = "enabled by napi-derive-backend"

[[bans.features]]
crate = "syn"
allow = ["default", "full", "fold", "extra-traits", "visit", "visit-mut", "derive", "parsing", "printing", "clone-impls", "proc-macro"]
reason = "enabled by napi-derive-backend"

[[bans.features]]
crate = "proc-macro2"
allow = ["default"]
reason = "enabled by the proc-macro graph of napi-derive"

[[bans.features]]
crate = "quote"
allow = ["default"]
reason = "enabled by the proc-macro graph of napi-derive"

[[bans.features]]
crate = "windows-sys"
allow = [
    "default",
    "Wdk",
    "Wdk_Foundation",
    "Wdk_Storage",
    "Wdk_Storage_FileSystem",
    "Wdk_System",
    "Wdk_System_IO",
    "Win32",
    "Win32_Foundation",
    "Win32_Networking",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]
reason = "enabled in the shipped graph by tokio (net), mio (os-ext and its Windows driver), socket2 and zero-sys (sockets, affinity, console control handler); the parents of each leaf feature count as enabled too"

[bans.build]
# Every crate of the binding graph allowed to run a build script (measured with
# cargo metadata over the seven targets on 2026-10-23): the binding itself, the
# napi glue, the C library build of the crypto provider and the Rust crates whose
# manifests declare a build script. `prebuilt-nasm` reaches aws-lc-sys through
# rustls's `aws_lc_rs` feature, in this graph as in the root workspace's.
allow-build-scripts = [
    "zero-server-node",
    "napi",
    # napi-sys 3.4.0 gained a build script that only emits cfg(napi_wasi_threads)
    # for the wasm32-wasip1-threads target (its build.rs, read 2026-10-14).
    "napi-sys",
    "aws-lc-sys",
    "aws-lc-rs",
    "rustls",
    # A dependency of jobserver inside the aws-lc-sys build helpers.
    "getrandom",
    "libc",
    "proc-macro2",
    "quote",
]
executables = "deny"
include-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
