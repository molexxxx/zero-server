# Dependency policy for the Node binding graph (bindings/node, a standalone
# crate outside the workspace). cargo-deny takes one configuration per run, so
# this file repeats the root deny.toml and adds the napi graph the binding
# brings; a change to the root policy is mirrored here and in deny/python.toml.
# Run with:
#   cargo deny --manifest-path bindings/node/Cargo.toml --config deny/node.toml check

[graph]
exclude-dev = true
# The seven prebuilt targets of the release workflows, as in the root policy; a
# dependency another target would pull is outside the shipped graph.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [{ allow = ["MPL-2.0"], crate = "cbindgen" }]

[bans]
multiple-versions = "deny"
wildcards = "deny"
external-default-features = "deny"

allow = [
    # The binding crate and the core crates it links.
    "zero-server-node",
    "zero-core",
    "zero-date",
    "zero-ffi",
    "zero-http",
    "zero-http-types",
    "zero-http1",
    "zero-io",
    "zero-limits",
    "zero-router",
    "zero-uri",
    "zero-rt",
    "zero-simd",
    "zero-sys",
    # Runtime seam, io-tokio. Checked against crates.io on 2026-10-01: none yanked,
    # each released within the year (tokio 1.53.1 on 2026-07-20, mio 1.2.3 on
    # 2026-09-02, socket2 0.6.5 on 2026-07-13, libc 0.2.189 on 2026-08-03, bytes
    # 1.12.1 on 2026-07-08, pin-project-lite 0.2.17 on 2026-02-27, windows-sys
    # 0.61.2 on 2025-10-06, windows-link 0.2.1 as its dependency).
    "tokio",
    "mio",
    "socket2",
    "libc",
    "bytes",
    "pin-project-lite",
    "windows-sys",
    "windows-link",
    # Node-API glue: napi 3 with the napi6 feature only, its derive macros, the
    # raw symbol table and the build helper (measured with cargo tree on
    # 2026-09-30 against napi 3.13.0, napi-derive 3.6.9, napi-sys 3.3.2,
    # napi-build 2.5.0).
    "napi",
    "napi-build",
    "napi-derive",
    "napi-derive-backend",
    "napi-sys",
    "convert_case",
    "ctor",
    "futures",
    "futures-channel",
    "futures-core",
    "futures-executor",
    "futures-io",
    "futures-macro",
    "futures-sink",
    "futures-task",
    "futures-util",
    "libloading",
    "nohash-hasher",
    "rustc-hash",
    "semver",
    "slab",
    "unicode-segmentation",
    "once_cell",
    "cfg-if",
    "getrandom",
    # Header generator, build-only in zero-ffi, and its transitive graph.
    "cbindgen",
    "bitflags",
    "equivalent",
    "errno",
    "fastrand",
    "hashbrown",
    "heck",
    "indexmap",
    "itoa",
    "linux-raw-sys",
    "log",
    "memchr",
    "proc-macro2",
    "quote",
    "r-efi",
    "rustix",
    "serde",
    "serde_core",
    "serde_derive",
    "serde_json",
    "serde_spanned",
    "syn",
    "tempfile",
    "toml",
    "toml_datetime",
    "toml_parser",
    "toml_writer",
    "unicode-ident",
    "winnow",
    "zmij",
]

deny = [
    { crate = "bindgen", reason = "no bindgen build: targets without pregenerated aws-lc-sys bindings use the ring provider" },
    { crate = "libclang-sys", reason = "no libclang in the build: see bindgen" },
    { crate = "clang-sys", reason = "no libclang in the build: see bindgen" },
]

skip-tree = [{ crate = "cbindgen", reason = "build-only tool with its own syn and winnow majors" }]

# The core crates are external to the binding's graph, so their `std` default
# is listed; the binding runs on std by definition.
[[bans.features]]
crate = "zero-core"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-date"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-http-types"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-http1"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-limits"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-router"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-uri"
allow = ["default", "std"]
reason = "the binding links the std build of the core"

[[bans.features]]
crate = "zero-http"
allow = ["default", "io-tokio"]
reason = "the binding links the core on its default readiness backend"

[[bans.features]]
crate = "zero-io"
allow = ["default", "io-tokio"]
reason = "the binding links the core on its default readiness backend"

# Defaults the napi graph enables on its own dependencies.
[[bans.features]]
crate = "futures"
allow = ["default", "std", "async-await", "executor"]
reason = "enabled by napi"

[[bans.features]]
crate = "libc"
allow = ["default", "std"]
reason = "enabled by libloading and napi-sys"

[[bans.features]]
crate = "libloading"
allow = ["default"]
reason = "enabled by napi-sys"

[[bans.features]]
crate = "memchr"
allow = ["default", "std"]
reason = "enabled by napi-derive and inside the cbindgen build-only tree"

[[bans.features]]
crate = "napi-derive"
allow = ["default", "type-def", "full"]
reason = "the binding's own edge"

[[bans.features]]
crate = "nohash-hasher"
allow = ["default", "std"]
reason = "enabled by napi"

[[bans.features]]
crate = "rustc-hash"
allow = ["default", "std"]
reason = "enabled by napi-derive-backend"

[[bans.features]]
crate = "semver"
allow = ["default", "std"]
reason = "enabled by napi-derive-backend"

[[bans.features]]
crate = "syn"
allow = ["default", "full", "fold", "extra-traits", "visit", "visit-mut", "derive", "parsing", "printing", "clone-impls", "proc-macro"]
reason = "enabled by napi-derive-backend and inside the cbindgen build-only tree"

[[bans.features]]
crate = "bytes"
allow = ["default"]
reason = "enabled by tokio's io-util in the shipped graph; bytes' default feature is `std`"

[[bans.features]]
crate = "fastrand"
allow = ["default"]
reason = "enabled by tempfile inside the cbindgen build-only tree"

[[bans.features]]
crate = "indexmap"
allow = ["default"]
reason = "enabled by cbindgen inside its build-only tree"

[[bans.features]]
crate = "proc-macro2"
allow = ["default"]
reason = "enabled by cbindgen and the proc-macro graph"

[[bans.features]]
crate = "quote"
allow = ["default"]
reason = "enabled by cbindgen and the proc-macro graph"

[[bans.features]]
crate = "rustix"
allow = ["default", "fs"]
reason = "enabled by tempfile inside the cbindgen build-only tree"

[[bans.features]]
crate = "serde_derive"
allow = ["default"]
reason = "enabled by serde inside the cbindgen build-only tree"

[[bans.features]]
crate = "serde_json"
allow = ["default"]
reason = "enabled by cbindgen inside its build-only tree"

[[bans.features]]
crate = "tempfile"
allow = ["default"]
reason = "enabled by cbindgen inside its build-only tree"

[[bans.features]]
crate = "windows-sys"
allow = [
    "default",
    "Wdk",
    "Wdk_Foundation",
    "Wdk_Storage",
    "Wdk_Storage_FileSystem",
    "Wdk_System",
    "Wdk_System_IO",
    "Win32",
    "Win32_Foundation",
    "Win32_Networking",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]
reason = "enabled by tempfile and libloading, and in the shipped graph by tokio (net), mio (os-ext and its Windows driver), socket2 and zero-sys (sockets, affinity); the parents of each leaf feature count as enabled too"

[bans.build]
allow-build-scripts = [
    "zero-ffi",
    "zero-server-node",
    "napi",
    "napi-build",
    "cbindgen",
    "libc",
    "getrandom",
    "proc-macro2",
    "quote",
    "rustix",
    "serde",
    "serde_core",
    "serde_json",
    "zmij",
]
executables = "deny"
include-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
